[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibfm-state-interpreter"
version = "0.1.0"
description = "Latent encoders and State Interpreter models for PHM"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.4",
    "scipy>=1.12",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
analysis = [
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
